<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
        <style>
            body{
                background-color: #d4d9d5;
                font-family: Inter;
                font-weight: 500;
                font-size: 18px;
            }

            .calc-form{
                justify-self: center;
                width: fit-content;
                background-color: #d4d9d5;
                padding: 24px;
                border-radius: 12px;
                box-shadow: 0px 2px 4px #0000001A, 0px 4px 6px #0000001A;

            }

            .button-rows{
                display: grid;
                grid-auto-flow: column;
                grid-template-columns: repeat(4, 107px);
                gap: 8px;
            }

            .button-grid{
                display: grid;
                grid-auto-flow: row;
                gap: 8px;
                
            }

            .grid-buttons{
                height: 56px;
                padding-left: 16px;
                padding-right: 16px;
                border-radius: 10px;
                border-color: #124e65BF;
                background-color: #748c92;
                border-style: solid;
                color: #2f3843;
                border-width: 1px;
                font-family: Inter;
                font-weight: 500;
                font-size: 18px;
            }

            .last-row{
                grid-template-columns: 107px 107px 1fr;
            }

            .btn-num{
                background-color: #d4d9d5; 
                color: #1d1f23;
                border-color: #124e6540;
            }

            .big-btn{
                background-color: #2f3843;
                border-color: #2f3843;
                color: #fcfcff;
                
            }

            .big-btn2{
                background-color: #8B1E22;
                border-color: #8B1E22;
                color: #fcfcff;
                
            }

            .text-box-holder{
                width: 452px;
                height: 140px;
                background-color: #202a30;
                border-radius: 12px;
                border-color: #3A3C41FF;
                margin-bottom: 24px;
                display: grid;
                justify-content: center;
                grid-template-rows: min-content;
                gap: 8px;
                

            }

            .placeholder-text{
                color: #d4d9d5; 
                margin: 12px 25px 0px 25px;
                min-height: 28px;
                overflow-wrap: anywhere;
                white-space: pre-wrap;

            }

            .text-box{
                height: 40px;
                background-color: transparent;
                border: none;
                color: #d4d9d5;
                font-family: Inter;
                font-size: 30px;
                font-weight: 700;
                margin: 0 25px;
                text-align: right;
            }
        </style>
    </head>
    <body>
        <header>
    <div class="headerholder">
        <div class="design">^-^</div>
        <div class="headerdiv"><a href="/">AS Level Calculator</a></div>
        <div class="design"><33</div>
    </div>
</header>
        <form class="calc-form" id="calcForm" action="/grid" method="POST">
            <div class="text-box-holder">
                <span class="placeholder-text">{{ outputedString }} </span>
                <input type="text" class="text-box" id="userExpression" name="userExpression" value="{{ userExpression or '' }}" autocomplete="off">

            </div>

            <div class="button-grid">
                <div class="button-rows">
                    <button type="button" class="key-btn btn-ang grid-buttons big-btn" id="btn_ang" data-val="DEG">DEG</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_infinity" data-val="oo">oo</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_k" data-val="k">k</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_x" data-val="x">x</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_asin" data-val="sin⁻¹(">sin⁻¹</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_acos" data-val="cos⁻¹(">cos⁻¹</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_atan" data-val="tan⁻¹(">tan⁻¹</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_e" data-val="e">e</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_sin" data-val="sin(">sin</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_cos" data-val="cos(">cos</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_tan" data-val="tan(">tan</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_pi" data-val="π">π</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_cbrt" data-val="∛(">∛</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_cube" data-val="^3">x³</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_pow" data-val="^">xⁿ</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_equalto" data-val="=">=</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_sqr" data-val="√(">√</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_sqrt" data-val="^2">x²</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_lparen" data-val="(">(</button>
                    <button type="button" class="key-btn btn-func grid-buttons" id="btn_rparen" data-val=")">)</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-action grid-buttons big-btn2" id="btn_ac" data-val="AC">AC</button>
                    <button type="button" class="key-btn btn-action grid-buttons big-btn2" id="btn_del" data-val="DEL">DEL</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_per" data-val=",">,</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_mul" data-val="/">/</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_7" data-val="7">7</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_8" data-val="8">8</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_9" data-val="9">9</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_mul" data-val="*">x</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_4" data-val="4">4</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_5" data-val="5">5</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_6" data-val="6">6</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_sub" data-val="-">-</button>
                </div>
                <div class="button-rows">
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_1" data-val="1">1</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_2" data-val="2">2</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_3" data-val="3">3</button>
                    <button type="button" class="key-btn btn-op grid-buttons" id="btn_add" data-val="+">+</button>
                </div>
                <div class="button-rows last-row">
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_0" data-val="0">0</button>
                    <button type="button" class="key-btn btn-num grid-buttons" id="btn_dot" data-val=".">.</button>
                    <button type="submit" name="solve" class="btn-op grid-buttons big-btn" id="btn_solve" value="True">Solve</button>
                </div>
            </div>
        </form>

        <script>
                document.addEventListener('DOMContentLoaded', () => {
                const inputField = document.getElementById('userExpression');
                const buttons = document.querySelectorAll('.key-btn');

                const inputHistory = [];

                buttons.forEach(button => {
                    button.addEventListener('click', () => {
                        const value = button.getAttribute('data-val');

                        if (value === 'DEL') {
                            if (inputHistory.length > 0) {
                                const lastLen = inputHistory.pop();
                                inputField.value = inputField.value.slice(0, -lastLen);
                            }
                            else if (inputField.value.length > 0){
                                inputField.value = inputField.value.slice(0, -1)
                            }
                        } 
                        else if (value == 'AC') {
                            inputField.value = "";
                            inputHistory.length = 0;
                        }
                        else if (button.id == 'btn_ang'){
                            const next = value == 'DEG' ? 'RAD' : 'DEG';
                            button.setAttribute("data-val", next)
                            button.textContent = next;
                            inputField.value += next;
                            inputHistory.push(next.length);
                        }
                        else {
                            inputField.value += value;
                            inputHistory.push(value.length);
                        }

                        inputField.focus();
                    });
                });

                inputField.addEventListener('input', () => {
                    inputHistory.length = 0;
                    });
                });
        </script>
                <footer>
            <div class="footerDiv">
                <div class="footerleft">
                        <div class="footertop">AS Level Calculator</div>
                        <div class="footerbottom">Made by Rapheal & Anael.</div>
                </div>
                <div class="footerright">Made for ThirdSpace HackClub</div>
            </div>
        </footer>
    </body>
</html>
